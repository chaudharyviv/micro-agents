name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: pytest

  evals-replay:
    # The offline half of the eval suite: no network, no secrets, no cost. Cases for validation and error paths
    # run the real agent code with the network blocked; the rest are checked against outputs recorded from
    # real runs (evals/golden/). It fails if an agent's output drifts from what the checks expect, if a case
    # file is invalid, or if a case has no recording. See .github/workflows/evals.yml for the live half.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run offline evals
      run: python evals/run_evals.py --replay --json-out eval-report.json

    - name: Upload the eval report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-replay-report
        path: eval-report.json
        if-no-files-found: ignore
